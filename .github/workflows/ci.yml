name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }} (ruff + pytest)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-core.txt
            requirements-dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Correctness rules only (syntax errors, undefined names) on the code the
      # tests cover. The repo-wide style config in pyproject.toml is not enforced yet.
      - name: Ruff
        run: >
          ruff check --isolated --target-version py311
          --select E9,F63,F7,F82
          lib spacetime/engine ml execution tests examples

      - name: Pytest
        run: pytest tests -q -p no:cacheprovider --color=yes

      - name: Quick start example
        run: python examples/bh_quickstart.py --no-plot
