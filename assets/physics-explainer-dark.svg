<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 724" width="900" height="724" role="img" aria-labelledby="t d">
<title id="t">From a price bar to a black hole, in four steps</title>
<desc id="d">Each bar gets a speed beta = |return| / c. Under 1 it is timelike, over it spacelike. Runs of timelike bars add mass; when mass crosses the formation threshold after five timelike bars in a row, a black hole (a well) forms.</desc>
<rect width="900" height="724" rx="14" fill="#0E1116"/>
<text x="44.0" y="58.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="28" fill="#ECE7DC" text-anchor="start" font-weight="700">From a price bar to a black hole</text>
<text x="44.0" y="90.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#B9B4A9" text-anchor="start" font-weight="400">What lib/srfm_core.py does to every bar. No physics needed.</text>
<rect x="44" y="118" width="396" height="236" rx="10" fill="#141820" stroke="#343A45"/>
<circle cx="76" cy="152" r="17" fill="#35A9C6"/>
<text x="76.0" y="158.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#141820" text-anchor="middle" font-weight="700">1</text>
<text x="104.0" y="159.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" fill="#ECE7DC" text-anchor="start" font-weight="700">Give the bar a speed</text>
<text x="64.0" y="198.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#B9B4A9" text-anchor="start" font-weight="400">c is the market&#x27;s speed limit:</text>
<text x="64.0" y="222.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#B9B4A9" text-anchor="start" font-weight="400">0.5% a day for SPY.</text>
<text x="64.0" y="262.0" font-family="ui-monospace,SFMono-Regular,'Cascadia Mono',Consolas,'DejaVu Sans Mono',Menlo,monospace" font-size="17" fill="#ECE7DC" text-anchor="start" font-weight="400" xml:space="preserve">β = |return| ÷ c</text>
<text x="64.0" y="336.0" font-family="ui-monospace,SFMono-Regular,'Cascadia Mono',Consolas,'DejaVu Sans Mono',Menlo,monospace" font-size="15" fill="#8F8B82" text-anchor="start" font-weight="400">MinkowskiClassifier</text>
<rect x="460" y="118" width="396" height="236" rx="10" fill="#141820" stroke="#343A45"/>
<circle cx="492" cy="152" r="17" fill="#35A9C6"/>
<text x="492.0" y="158.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#141820" text-anchor="middle" font-weight="700">2</text>
<text x="520.0" y="159.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" fill="#ECE7DC" text-anchor="start" font-weight="700">Inside or outside the cone?</text>
<text x="480.0" y="198.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#B9B4A9" text-anchor="start" font-weight="400">β &lt; 1: timelike, an ordinary move.</text>
<text x="480.0" y="222.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#B9B4A9" text-anchor="start" font-weight="400">β ≥ 1: spacelike, a jump.</text>
<text x="480.0" y="262.0" font-family="ui-monospace,SFMono-Regular,'Cascadia Mono',Consolas,'DejaVu Sans Mono',Menlo,monospace" font-size="17" fill="#ECE7DC" text-anchor="start" font-weight="400" xml:space="preserve">ds² = c²dt² − dx²</text>
<text x="480.0" y="336.0" font-family="ui-monospace,SFMono-Regular,'Cascadia Mono',Consolas,'DejaVu Sans Mono',Menlo,monospace" font-size="15" fill="#8F8B82" text-anchor="start" font-weight="400">MinkowskiClassifier.update</text>
<rect x="44" y="374" width="396" height="236" rx="10" fill="#141820" stroke="#343A45"/>
<circle cx="76" cy="408" r="17" fill="#35A9C6"/>
<text x="76.0" y="414.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#141820" text-anchor="middle" font-weight="700">3</text>
<text x="104.0" y="415.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" fill="#ECE7DC" text-anchor="start" font-weight="700">Ordered bars add mass</text>
<text x="64.0" y="454.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#B9B4A9" text-anchor="start" font-weight="400">Timelike: mass grows with the move,</text>
<text x="64.0" y="478.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#B9B4A9" text-anchor="start" font-weight="400">boosted by the streak (x1 to x2).</text>
<text x="64.0" y="502.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#B9B4A9" text-anchor="start" font-weight="400">Spacelike: mass × 0.7, streak = 0.</text>
<text x="64.0" y="542.0" font-family="ui-monospace,SFMono-Regular,'Cascadia Mono',Consolas,'DejaVu Sans Mono',Menlo,monospace" font-size="17" fill="#ECE7DC" text-anchor="start" font-weight="400" xml:space="preserve">mass = mass×0.95 + |r|×100×boost</text>
<text x="64.0" y="592.0" font-family="ui-monospace,SFMono-Regular,'Cascadia Mono',Consolas,'DejaVu Sans Mono',Menlo,monospace" font-size="15" fill="#8F8B82" text-anchor="start" font-weight="400">BlackHoleDetector.update</text>
<rect x="460" y="374" width="396" height="236" rx="10" fill="#141820" stroke="#343A45"/>
<circle cx="492" cy="408" r="17" fill="#E0B43A"/>
<text x="492.0" y="414.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#141820" text-anchor="middle" font-weight="700">4</text>
<text x="520.0" y="415.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" fill="#ECE7DC" text-anchor="start" font-weight="700">A black hole forms</text>
<text x="480.0" y="454.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#B9B4A9" text-anchor="start" font-weight="400">mass &gt; 1.5 and 5+ timelike</text>
<text x="480.0" y="478.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#B9B4A9" text-anchor="start" font-weight="400">bars in a row: a well is active.</text>
<text x="480.0" y="502.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#B9B4A9" text-anchor="start" font-weight="400">It stays while mass &gt; 1.0 and</text>
<text x="480.0" y="526.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#B9B4A9" text-anchor="start" font-weight="400">the streak holds.</text>
<path d="M680,534 C730,540 746,564 752,586 L768,586 C774,564 790,540 840,534 Z" fill="#E0B43A" fill-opacity="0.28" stroke="#E0B43A" stroke-width="2"/>
<circle cx="698" cy="518" r="5" fill="#35A9C6"/>
<circle cx="720" cy="524" r="5" fill="#35A9C6"/>
<circle cx="740" cy="530" r="5" fill="#35A9C6"/>
<text x="480.0" y="592.0" font-family="ui-monospace,SFMono-Regular,'Cascadia Mono',Consolas,'DejaVu Sans Mono',Menlo,monospace" font-size="15" fill="#8F8B82" text-anchor="start" font-weight="400">BlackHoleDetector.bh_active</text>
<path d="M443,152 L457,152 M451,147 L457,152 L451,157" stroke="#B9B4A9" stroke-width="2" fill="none"/>
<path d="M443,408 L457,408 M451,403 L457,408 L451,413" stroke="#B9B4A9" stroke-width="2" fill="none"/>
<text x="44.0" y="654.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" xml:space="preserve"><tspan fill="#ECE7DC" font-weight="700">Lorentz factor</tspan><tspan fill="#B9B4A9" font-weight="400"> γ = 1/√(1 − v²), v = |r| ÷ 1% (max 0.99): each bar adds 1/γ of proper time.</tspan></text>
<text x="44.0" y="680.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#B9B4A9" text-anchor="start" font-weight="400">Direction of the well: the sign of the timelike run&#x27;s cumulative return.</text>
</svg>